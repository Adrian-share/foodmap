<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1661" viewBox="0 0 1280 1661"><rect width="1280" height="1661" fill="#0d1117"/><g font-family="PingFang SC,Heiti SC,Arial,sans-serif" fill="#c9d1d9"><text x="40" y="55" font-size="30" fill="#58a6ff" font-weight="bold">探店地图 · 从候选采集到核验内容发布</text><text x="40" y="86" font-size="16" fill="#8b949e" font-weight="normal">FACT-31 · 2026-11-16 · 源码 21e0aaf · 架构导出图（非浏览器截图）</text><text x="40" y="118" font-size="15" fill="#8b949e" font-weight="normal">蓝：现有组件 / 请求       绿：规划组件 · 尚未上线       紫：持久数据       红：缺口</text><path d="M40 148H1240" stroke="#30363d"/><text x="40" y="180" font-size="23" fill="#58a6ff" font-weight="bold">01 · 现状请求和数据流</text><text x="40" y="210" font-size="14" fill="#8b949e" font-weight="normal">公开读取 · 已部署；本轮依据源码及既有部署记录核对</text><rect x="40" y="224" width="282" height="112" rx="8" fill="#1a1f2e" stroke="#30363d"/><text x="52" y="253" font-size="17" fill="#58a6ff" font-weight="bold">浏览器 / 用户</text><text x="52" y="283" font-size="13" fill="#c9d1d9" font-weight="normal">首页、地图、合集、详情</text><text x="52" y="307" font-size="13" fill="#c9d1d9" font-weight="normal">请求 Sites 正式域名</text><text x="325" y="287" font-size="20" fill="#58a6ff" font-weight="normal">↔</text><rect x="346" y="224" width="282" height="112" rx="8" fill="#161b22" stroke="#30363d"/><text x="358" y="253" font-size="17" fill="#58a6ff" font-weight="bold">Sites Worker · 云端</text><text x="358" y="283" font-size="13" fill="#c9d1d9" font-weight="normal">worker.mjs → amap-handler</text><text x="358" y="307" font-size="13" fill="#c9d1d9" font-weight="normal">公开请求默认读取编译状态</text><text x="631" y="287" font-size="20" fill="#58a6ff" font-weight="normal">↔</text><rect x="652" y="224" width="282" height="112" rx="8" fill="#1b1728" stroke="#30363d"/><text x="664" y="253" font-size="17" fill="#c4b5fd" font-weight="bold">公开编译数据 / 图片</text><text x="664" y="283" font-size="13" fill="#c9d1d9" font-weight="normal">compiled.json + public-assets</text><text x="664" y="307" font-size="13" fill="#c9d1d9" font-weight="normal">构建时打包；10 家 baseline + 5 家</text><rect x="958" y="224" width="282" height="112" rx="8" fill="#1a1f2e" stroke="#30363d"/><text x="970" y="253" font-size="17" fill="#58a6ff" font-weight="bold">高德 / B站 · 第三方</text><text x="970" y="283" font-size="13" fill="#c9d1d9" font-weight="normal">SDK + /_AMapService 代理</text><text x="970" y="307" font-size="13" fill="#c9d1d9" font-weight="normal">B站官方 iframe 承载原片</text><text x="40" y="361" font-size="14" fill="#8b949e" font-weight="normal">每日候选 · 当前唯一生产调度；箭头表示上传链路</text><rect x="40" y="375" width="282" height="112" rx="8" fill="#161b22" stroke="#30363d"/><text x="52" y="404" font-size="17" fill="#58a6ff" font-weight="bold">Multica · 云端调度</text><text x="52" y="434" font-size="13" fill="#c9d1d9" font-weight="normal">active · 每天 09:00 上海时区</text><text x="52" y="458" font-size="13" fill="#c9d1d9" font-weight="normal">下次 11/17；固定执行器无模型</text><text x="325" y="438" font-size="20" fill="#58a6ff" font-weight="normal">→</text><rect x="346" y="375" width="282" height="112" rx="8" fill="#161b22" stroke="#30363d"/><text x="358" y="404" font-size="17" fill="#58a6ff" font-weight="bold">固定 Node CLI · Mini</text><text x="358" y="434" font-size="13" fill="#c9d1d9" font-weight="normal">官方来源 → 候选、游标、退避</text><text x="358" y="458" font-size="13" fill="#c9d1d9" font-weight="normal">18 UID / 92 BV / 77 待核</text><text x="631" y="438" font-size="20" fill="#58a6ff" font-weight="normal">→</text><rect x="652" y="375" width="282" height="112" rx="8" fill="#161b22" stroke="#30363d"/><text x="664" y="404" font-size="17" fill="#58a6ff" font-weight="bold">SSH 固定中继 · 服务器</text><text x="664" y="434" font-size="13" fill="#c9d1d9" font-weight="normal">仅固定 content-ingest GET/POST</text><text x="664" y="458" font-size="13" fill="#c9d1d9" font-weight="normal">正文 ≤ 2 MiB；无 shell / 任意 URL</text><text x="937" y="438" font-size="20" fill="#58a6ff" font-weight="normal">→</text><rect x="958" y="375" width="282" height="112" rx="8" fill="#1b1728" stroke="#30363d"/><text x="970" y="404" font-size="17" fill="#c4b5fd" font-weight="bold">私有 R2 → 登录后台</text><text x="970" y="434" font-size="13" fill="#c9d1d9" font-weight="normal">private/content-incremental-v1.json</text><text x="970" y="458" font-size="13" fill="#c9d1d9" font-weight="normal">仅台账更新；不会自动公开门店</text><text x="48" y="512" font-size="15" fill="#c9d1d9" font-weight="normal">公开请求：浏览器 ↔ Worker ↔ 编译数据；地图 SDK 直连高德，并经 Worker 代理服务；详情 iframe → B站。</text><text x="48" y="543" font-size="15" fill="#c9d1d9" font-weight="normal">MCP 现状：WorkBuddy 配置 http://127.0.0.1:8767/mcp → Node amap-server → 静态 runtime；本轮该端口未监听。</text><text x="48" y="574" font-size="15" fill="#c9d1d9" font-weight="normal">来源限制：最近一轮 partial，1 来源成功 / 18 退避 / 0 新增；历史 HTTP 412、-352、-403，不代表全量覆盖。</text><path d="M40 619H1240" stroke="#30363d"/><text x="40" y="651" font-size="23" fill="#3fb950" font-weight="bold">02 · 目标服务和数据流</text><text x="40" y="681" font-size="14" fill="#8b949e" font-weight="normal">A · 发现与清理（全部待实现）</text><rect x="40" y="695" width="282" height="112" rx="8" fill="#122117" stroke="#30363d"/><text x="52" y="724" font-size="17" fill="#3fb950" font-weight="bold">GitHub · 版本化名单</text><text x="52" y="754" font-size="13" fill="#c9d1d9" font-weight="normal">固定 repo / ref / path</text><text x="52" y="778" font-size="13" fill="#c9d1d9" font-weight="normal">15 分钟轮询；commit + hash</text><text x="325" y="758" font-size="20" fill="#58a6ff" font-weight="normal">→</text><rect x="346" y="695" width="282" height="112" rx="8" fill="#122117" stroke="#30363d"/><text x="358" y="724" font-size="17" fill="#3fb950" font-weight="bold">Python 常驻服务 · Mini</text><text x="358" y="754" font-size="13" fill="#c9d1d9" font-weight="normal">唯一业务调度 + SQLite 租约</text><text x="358" y="778" font-size="13" fill="#c9d1d9" font-weight="normal">单例、游标、退避、预算、心跳</text><text x="631" y="758" font-size="20" fill="#58a6ff" font-weight="normal">→</text><rect x="652" y="695" width="282" height="112" rx="8" fill="#161b22" stroke="#30363d"/><text x="664" y="724" font-size="17" fill="#58a6ff" font-weight="bold">Node 适配器 · Mini</text><text x="664" y="754" font-size="13" fill="#c9d1d9" font-weight="normal">复用采集 / 台账 / 截图契约</text><text x="664" y="778" font-size="13" fill="#c9d1d9" font-weight="normal">官方元数据、字幕、原帧、POI</text><text x="937" y="758" font-size="20" fill="#58a6ff" font-weight="normal">→</text><rect x="958" y="695" width="282" height="112" rx="8" fill="#122117" stroke="#30363d"/><text x="970" y="724" font-size="17" fill="#3fb950" font-weight="bold">真正 Pi 子进程 · Mini</text><text x="970" y="754" font-size="13" fill="#c9d1d9" font-weight="normal">1.5.2 · 持久 JSONL RPC</text><text x="970" y="778" font-size="13" fill="#c9d1d9" font-weight="normal">只加载项目工具；独立 session</text><text x="40" y="832" font-size="14" fill="#8b949e" font-weight="normal">B · Python 收取 Pi 结构化结果后继续；Pi 无发布凭据</text><rect x="40" y="846" width="282" height="112" rx="8" fill="#122117" stroke="#30363d"/><text x="52" y="875" font-size="17" fill="#3fb950" font-weight="bold">独立验证器 · Mini</text><text x="52" y="905" font-size="13" fill="#c9d1d9" font-weight="normal">作者 / 分店 / 片段 / 原帧 / 描述</text><text x="52" y="929" font-size="13" fill="#c9d1d9" font-weight="normal">通过才发布；缺项留私有待核</text><text x="325" y="909" font-size="20" fill="#58a6ff" font-weight="normal">→</text><rect x="346" y="846" width="282" height="112" rx="8" fill="#122117" stroke="#30363d"/><text x="358" y="875" font-size="17" fill="#3fb950" font-weight="bold">Python 发布器 · Mini</text><text x="358" y="905" font-size="13" fill="#c9d1d9" font-weight="normal">复用固定 SSH 通道</text><text x="358" y="929" font-size="13" fill="#c9d1d9" font-weight="normal">分片 → 清单 → CAS 提交 / 对账</text><text x="631" y="909" font-size="20" fill="#58a6ff" font-weight="normal">→</text><rect x="652" y="846" width="282" height="112" rx="8" fill="#1b1728" stroke="#30363d"/><text x="664" y="875" font-size="17" fill="#c4b5fd" font-weight="bold">R2 · 不可变公开版本</text><text x="664" y="905" font-size="13" fill="#c9d1d9" font-weight="normal">图片按哈希寻址；当前指针</text><text x="664" y="929" font-size="13" fill="#c9d1d9" font-weight="normal">完整资源确认后原子切版本</text><text x="937" y="909" font-size="20" fill="#58a6ff" font-weight="normal">→</text><rect x="958" y="846" width="282" height="112" rx="8" fill="#122117" stroke="#30363d"/><text x="970" y="875" font-size="17" fill="#3fb950" font-weight="bold">Worker · 统一版本读取</text><text x="970" y="905" font-size="13" fill="#c9d1d9" font-weight="normal">首页 / 地图 / 合集 / 详情</text><text x="970" y="929" font-size="13" fill="#c9d1d9" font-weight="normal">新增公开快照 → 本地 MCP 适配</text><text x="48" y="983" font-size="15" fill="#c9d1d9" font-weight="normal">控制关系：Python ↔ Pi（stdin/stdout JSONL）；Pi → 受限 Node 内容工具 → 本条证据；Python 独立核验结果。</text><text x="48" y="1014" font-size="15" fill="#c9d1d9" font-weight="normal">服务托管：Mini launchd → Python → Pi；SQLite 保存业务阶段，Pi session 保存上下文，空闲不调用模型。</text><text x="48" y="1045" font-size="15" fill="#c9d1d9" font-weight="normal">闭环出口：Worker → 用户页面 → 高德 / B站；MCP 读取同一公开 data_version；Python 心跳 → 私有后台。</text><path d="M40 1090H1240" stroke="#30363d"/><text x="40" y="1122" font-size="23" fill="#f85149" font-weight="bold">03 · 现状缺口与冻结的目标接口</text><text x="48" y="1152" font-size="15" fill="#c9d1d9" font-weight="normal">名单：当前 seed / ledger 固定集合 → watchlist.v1 + watchlist.sync；先注册新 UID，再允许采集与公开校验。</text><text x="48" y="1183" font-size="15" fill="#c9d1d9" font-weight="normal">Pi：Mini Node 22.16.0，未发现 Pi → 项目独立 Node ≥ 22.19.0 + 锁定 Pi 1.5.2；真实模型仍待阶段 2 接通。</text><text x="48" y="1214" font-size="15" fill="#c9d1d9" font-weight="normal">核验：旧 assess() 接受审核标签，允许已核准内容缺图 → 新自动内容必须有原帧与独立证据；保留原 15 店。</text><text x="48" y="1245" font-size="15" fill="#c9d1d9" font-weight="normal">上传：中继能传 JSON；旧服务端拒绝 operation、旧客户端仅认候选回执 → 扩展严格操作协议，不能直接复用即发布。</text><text x="48" y="1276" font-size="15" fill="#c9d1d9" font-weight="normal">版本：当前公开内容随构建固定 → blob.chunk / release.stage / release.commit / receipt.get / release.rollback。</text><text x="48" y="1307" font-size="15" fill="#c9d1d9" font-weight="normal">读取：公开 Worker 与本地 MCP 目前未接动态 R2 → 共享公开快照契约，固定版本分页，成功提交后 ≤ 60 秒可见。</text><path d="M40 1352H1240" stroke="#30363d"/><text x="40" y="1384" font-size="23" fill="#bc8cff" font-weight="bold">04 · 关键边界及调度切换</text><text x="48" y="1414" font-size="15" fill="#c9d1d9" font-weight="normal">① 真实来源边界：名单和原片文字均为数据；视频 / 音频 / 流分片不落盘；图片可存；受限记 blocked_capture。</text><text x="48" y="1445" font-size="15" fill="#c9d1d9" font-weight="normal">② Pi 边界：--no-builtin-tools + 固定 --tools 白名单；禁 MCP / 外部发现；显式加载项目扩展，注册不等于启用。</text><text x="48" y="1476" font-size="15" fill="#c9d1d9" font-weight="normal">③ 结算边界：prompt 接受 ≠ 完成；agent_end ≠ 完成；等待 agent_settled 后再验证 schema 与业务证据。</text><text x="48" y="1507" font-size="15" fill="#c9d1d9" font-weight="normal">④ 发布边界：暂存私有证据与图片 → 全量核验 → 条件写 current 指针；同包幂等、旧版冲突拒绝、可回退。</text><text x="48" y="1538" font-size="15" fill="#c9d1d9" font-weight="normal">⑤ 切换顺序：预览隔离状态 → 真实 Pi / 恢复 / 发布验收 → 暂停旧 Autopilot 并排空 → 启用 Python 生产调度。</text><text x="48" y="1569" font-size="15" fill="#c9d1d9" font-weight="normal">⑥ 回退顺序：先停 Python 并确认释放写锁，再恢复旧 Autopilot；launchd 只托管生命周期，不是第二业务调度器。</text><text x="40" y="1626" font-size="14" fill="#8b949e" font-weight="normal">公开生产仍为候选采集；目标闭环待阶段 2 / 3 实现。完整事实范围与接口定义见 HTML、证据表和协议文档。</text></g></svg>