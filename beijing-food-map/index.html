<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="从北京的一个地点出发，在地图上发现博主探过的餐厅，查看原视频截图与探店记录。">
<title>北京探店地图 · 发现附近好味道</title>
<link rel="stylesheet" href="/content/home-cards.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/" aria-label="北京探店地图首页"><span class="brand-mark" aria-hidden="true">探</span>探店地图<span class="city-label">北京</span></a>
  <nav aria-label="主导航"><a href="/" aria-current="page">探索附近</a><a href="/content/">探店记录 <span aria-hidden="true">↗</span></a></nav>
  <span class="header-note">跟着视频，发现一座城的好味道</span>
</header>
<div class="search-bar">
  <form id="search">
    <div class="search-field"><label for="query">起点</label><span aria-hidden="true">⌕</span><input id="query" required placeholder="搜索地铁站、酒店或地标" autocomplete="off" maxlength="80"><button type="submit">搜索附近</button></div>
    <div class="creator-field"><label for="creator-filter">博主</label><select id="creator-filter"><option value="">全部博主</option></select></div>
    <button id="clear-filter" type="button" hidden>清除筛选</button>
    <button id="retry-search" type="button" hidden>重试搜索</button>
  </form>
  <div class="search-context"><p class="origin-label"><span class="origin-dot" aria-hidden="true"></span>当前起点 <strong id="current-origin">正在定位…</strong><span id="filter-state">全部博主</span></p><div class="chips" aria-label="预设起点"><span>试试</span><button type="button" data-origin="王府井">王府井</button><button type="button" data-origin="东坝">东坝</button><button type="button" data-origin="大钟寺">大钟寺</button></div></div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="candidates" class="chips" aria-label="请选择准确的起点"></div>
</div>
<main class="layout">
  <section class="map-panel" aria-label="起点和门店位置">
    <div class="map-frame"><div id="preview" aria-label="离线位置示意图"></div><div id="map" hidden aria-label="高德交互式地图"></div><div class="map-caption"><span class="origin-dot"></span>起点<span class="shop-dot"></span>探店门店</div><button id="fit-map" type="button" hidden>⌖ 显示全部图钉</button></div>
    <div class="map-toolbar"><p id="map-status" role="status" aria-live="polite">正在加载地图…</p><button id="retry-map" type="button" hidden>重试地图</button></div>
    <p class="map-note">从一个地点出发，让好味道带路。<br><span>距离为直线距离，出发前请核实营业状态。</span></p>
  </section>
  <section class="result-panel" aria-label="附近探店">
    <div class="results-heading"><div><p class="eyebrow">EXPLORE BEIJING</p><h1>附近，值得一探</h1></div><span class="sort-label">↗ 由近到远</span></div>
    <p id="result-count">正在查找附近探店…</p>
    <ol id="results" aria-label="附近门店，按直线距离排序"></ol>
    <div id="empty-state" hidden><span aria-hidden="true">⌕</span><h2>这里还没有匹配的探店</h2><p id="empty-message">试试其他地点，或清除博主筛选。</p></div>
    <div class="more-row"><button id="load-more" type="button" hidden>查看更多</button><p id="list-end" hidden>已展示全部收录门店</p></div>
    <footer>只呈现已收录的探店记录 · 图片来自对应原视频<br>GCJ-02 坐标 · 直线距离不代表步行或驾车距离</footer>
  </section>
</main>
<script src="samples.js"></script><script src="/content/home-cards.js"></script><script src="prototype.js"></script>
</body>
</html>
